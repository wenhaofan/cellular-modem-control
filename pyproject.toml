[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cellular-modem-control"
version = "0.1.0"
description = "Cross-platform AT-command control for cellular modules."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "cellular-modem-control contributors" }
]
keywords = ["at-commands", "cellular", "gsm", "lte", "modem", "sms", "serial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.10",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.5",
  "tomli>=2.0; python_version<'3.11'",
  "twine>=5.0",
]

[project.scripts]
modemctl = "cellular_modem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellular_modem = ["py.typed"]
quectel_modem = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"scripts/check.py" = ["S603"]
"scripts/check_cli_examples.py" = ["S603"]
"scripts/check_install.py" = ["S603"]

[tool.mypy]
python_version = "3.10"
packages = ["cellular_modem", "quectel_modem"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["cellular_modem", "quectel_modem"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
